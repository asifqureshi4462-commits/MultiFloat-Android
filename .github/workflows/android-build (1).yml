name: MultiFloat Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      STORE_PASSWORD: multifloat123
      KEY_PASSWORD: multifloat123

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses (SDK is preinstalled on runner)
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore keystores from cache
        id: ks-cache
        uses: actions/cache@v4
        with:
          path: |
            debug.keystore
            my-upload-key.jks
          key: multifloat-keystores-v1

      - name: Generate keystores (only if not cached)
        if: steps.ks-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MultiFloat,O=MultiFloat,C=IN"

      - name: Build Debug + Release APK
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-configuration-cache

      - name: Show built APKs
        run: find app/build/outputs/apk -name "*.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiFloat-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiFloat-release-apk
          path: app/build/outputs/apk/release/*.apk
